[project]
name = "rule-engine"
version = "0.1.0"
description = "Быстрый объяснимый поиск голосовых команд и объектов + движок правил на конечных автоматах с откатами"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# настоящая лемматизация вместо встроенного стеммера: --stemmer pymorphy
morph = ["pymorphy3>=2.0"]

[project.scripts]
rule-engine = "rule_engine:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B905", "B023", "SIM108"]
