[project]
name = "rule-engine"
version = "0.1.0"
description = "Движок правил: распознаёт сценарии умного дома в потоке токенов"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rule-engine = "rule_engine.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
